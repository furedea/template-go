ls:
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*
  <<: &files
    .md: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:(README|CONTRIBUTING|CHANGELOG|AGENTS|CLAUDE|SKILL)
    .*: regex:[a-z0-9]*([._][a-z0-9]+)*
  # Go package directories are identifiers, so they use lowercase letters and digits only.
  # A nested block replaces the root rules, so it re-merges the file rules.
  internal:
    <<: *files
    .dir: regex:[a-z0-9]+

  # Directories named after what they hold, never pkg, util or common.
  "**/{pkg,util,common}":
    .dir: exists:0

ignore:
  - .git
  - .direnv
  - result
  - result-*
  - "{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - "**/{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - docs/logs
  - "**/docs/logs"
